  <path d="M154,-20 C131,150 177,350 142,520 L215,520 C249,350 203,150 226,-20 Z" fill="#000000" opacity="0.16" filter="url(#soft)"/>
  <path d="M291,-20 C303,150 279,350 297,520 L375,520 C357,350 381,150 369,-20 Z" fill="#ffffff" opacity="0.2" filter="url(#soft)"/>
  <path d="M422,-20 C452,150 392,350 437,520 L533,520 C488,350 548,150 518,-20 Z" fill="#000000" opacity="0.16" filter="url(#soft)"/>
  <path d="M555,-20 C558,150 551,350 557,520 L667,520 C662,350 669,150 665,-20 Z" fill="#ffffff" opacity="0.2" filter="url(#soft)"/>
  <path d="M686,-20 C658,150 714,350 672,520 L780,520 C822,350 766,150 794,-20 Z" fill="#000000" opacity="0.16" filter="url(#soft)"/>
