<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Silk fabric, satin weave">
  <defs>
    <pattern id="weave" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <rect width="5" height="5" fill="#a8326a"/><rect width="5" height="1" fill="#c24e86" opacity=".7"/>
    </pattern>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0"/><stop offset=".3" stop-color="#ffd9a0" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#ffd9a0" stop-opacity="0"/><stop offset=".7" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".85" stop-color="#5a0f36" stop-opacity=".45"/><stop offset="1" stop-color="#5a0f36" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#a8326a"/>
  <rect width="800" height="500" fill="url(#weave)"/>
  <rect width="800" height="500" fill="url(#sheen)"/>
