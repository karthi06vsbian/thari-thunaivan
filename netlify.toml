[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # NEXT_PUBLIC_* values are inlined into the client bundle by design (Firebase
  # web config is not a secret), so exclude them from Netlify's secrets scanner.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST,NEXT_PUBLIC_COMPANY_WHATSAPP"
